
[project]
name = "rag"
version = "0.1.0"
description = "Take Home assignment for KBC group"
requires-python = ">=3.12"

dependencies = [
    "matplotlib",
    "chromadb",
    "sentence-transformers",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pyrefly"
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F401", "F403", "F405", "E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pyrefly]
project-excludes = ["src/notebooks/*"]

[tool.pyrefly.errors]
not-callable = false
