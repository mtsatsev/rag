
[project]
name = "rag"
version = "0.1.0"
description = "Take Home assignment for KBC group"
requires-python = ">=3.12"

dependencies = [
    "matplotlib",
    "chromadb",
    "sentence-transformers",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "langchain-text-splitters>=1.1.3",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0.3",
    "umap-learn>=0.5.12",
    "polars>=2.0.0",
    "ollama>=0.6.3",
]

[project.scripts]
rag = "rag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pyrefly",
    "ipykernel>=7.4.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F401", "F403", "F405", "E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pyrefly]
project-excludes = ["src/notebooks/*"]

[tool.pylint.main]
ignore = [".venv"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
    "invalid-name",
    "import-error"
]

[tool.pyrefly.errors]
not-callable = false
